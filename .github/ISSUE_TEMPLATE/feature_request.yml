name: Feature request / 功能建议
description: Propose a focused improvement / 提议聚焦的改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe the user or operator problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: Explain the desired behavior and why it fits AgentFlowing.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他方案
      description: What alternatives or workarounds did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Authentication / 认证
        - Agents and runtime / Agent 运行时
        - Billing and credits / 计费与积分
        - Workspaces and permissions / 工作空间与权限
        - Files and API / 文件与 API
        - UI and localization / 界面与多语言
        - Infrastructure and tooling / 基础设施与工具
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 检查
      options:
        - label: I searched existing issues and the roadmap. / 我已搜索现有 Issue 和路线图。
          required: true
        - label: I am willing to help implement or test this change. / 我愿意协助实现或测试。
